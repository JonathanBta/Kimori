<svg #svgRef class="diagram-canvas" width="100%" height="100%">
  <g class="diagram-viewport" transform="translate(600,80)"></g>
</svg>

@if (state.people().length === 0) {
  <div class="diagram-empty">
    <p>No people yet. Use "Add person" in the header to start building this tree.</p>
  </div>
}
